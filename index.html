<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahabatku.id</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eaf2ff,#f7faff);
  color:#24324a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container{
  background:white;
  width:100%;
  max-width:480px;
  padding:30px 22px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 8px 30px #315cba20;
}
.logo{
  font-size:45px;
  margin-bottom:8px;
}
h1{color:#315cba;margin:5px 0}
p{color:#64748b;line-height:1.6}
.pilihan{
  display:block;
  width:100%;
  padding:16px;
  margin-top:14px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}
.siswa{background:#315cba;color:white}
.admin{background:#e8efff;color:#315cba}
.guru{background:#dff5e9;color:#187345}
.pilihan:hover{opacity:.85}
small{display:block;margin-top:25px;color:#94a3b8}
</style>
</head>
<body>
<div class="container">
  <div class="logo">💙</div>
  <h1>Sahabatku.id</h1>
  <p>
    Teman digital untuk membangun pertemanan sehat,
    saling menghargai, dan mencegah perundungan.
  </p>

  <h3>Silakan Pilih Jenis Login</h3>

  <a class="pilihan siswa" href="auth.html?role=siswa">
    Login Siswa
  </a>

  <a class="pilihan admin" href="auth.html?role=admin">
    Login Admin
  </a>

  <a class="pilihan guru" href="auth.html?role=guru_bk">
    Login Guru BK
  </a>

  <small>© 2026 Sahabatku.id</small>
</div>
</body>
</html>
