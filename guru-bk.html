<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Guru BK - Sahabatku.id</title>

<style>

* { box-sizing: border-box; }

body {

  font-family: Arial, sans-serif;

  background: #edf4ff;

  margin: 0;

  padding: 20px;

  color: #24324a;

}

.container {

  max-width: 1100px;

  margin: auto;

}

header {

  background: #315caa;

  color: white;

  padding: 25px;

  border-radius: 15px;

  margin-bottom: 20px;

}

.card {

  background: white;

  padding: 22px;

  border-radius: 14px;

  margin-bottom: 20px;

  box-shadow: 0 3px 12px #00000010;

}

button, select, textarea {

  font: inherit;

}

button {

  background: #315caa;

  color: white;

  border: none;

  padding: 11px 17px;

  border-radius: 8px;

  cursor: pointer;

  margin: 5px 0;

}

button:hover { background: #234680; }

select, textarea {

  width: 100%;

  padding: 10px;

  border: 1px solid #ccd5e5;

  border-radius: 8px;

  margin: 7px 0;

}

textarea {

  min-height: 90px;

  resize: vertical;

}

#pesan {

  color: #315caa;

  font-weight: bold;

}

.table-wrap { overflow-x: auto; }

table {

  width: 100%;

  border-collapse: collapse;

  min-width: 850px;

}

th, td {

  padding: 12px;

  border-bottom: 1px solid #ddd;

  text-align: left;

  vertical-align: top;

}

th { background: #e8f0ff; }

.keterangan {

  color: #667085;

  font-size: 13px;

}

</style>

</head>

<body>

<div class="container">

<header>

  <h1>Dashboard Guru BK</h1>

  <p>Sahabatku.id - Layanan Bimbingan dan Konseling</p>

</header>

<div class="card">

  <h2>Selamat Datang, Guru BK!</h2>

  <p>Kelola permintaan bantuan dan berikan tanggapan kepada siswa.</p>

  <button id="muat">Muat Data Permintaan</button>

  <button id="keluar">Keluar</button>

  <p id="pesan">Memeriksa akun...</p>

</div>

<div class="card">

  <h2>Daftar Permintaan Bantuan Siswa</h2>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Nama Siswa</th>

          <th>Masalah</th>

          <th>Cerita Siswa</th>

          <th>Status</th>

          <th>Balasan Guru BK</th>

        </tr>

      </thead>

      <tbody id="daftar">

        <tr><td colspan="5">Memuat data...</td></tr>

      </tbody>

    </table>

  </div>

</div>

</div>

<script type="module">

import { supabase } from './supabase.js';

const pesan = document.getElementById('pesan');

const daftar = document.getElementById('daftar');

async function periksaAkun() {

  const { data: { user }, error } = await supabase.auth.getUser();

  if (error || !user) {

    pesan.textContent = 'Silakan login terlebih dahulu.';

    return false;

  }

  const { data: role, error: roleError } = await supabase

    .from('user_roles')

    .select('role')

    .eq('user_id', user.id)

    .maybeSingle();

  if (roleError || !role || role.role !== 'guru_bk') {

    pesan.textContent = 'Akses ditolak. Halaman khusus Guru BK.';

    return false;

  }

  pesan.textContent = 'Login berhasil sebagai Guru BK.';

  return true;

}

async function muatData() {

  if (!(await periksaAkun())) {

    daftar.innerHTML = '<tr><td colspan="5">Akses tidak tersedia.</td></tr>';

    return;

  }

  pesan.textContent = 'Mengambil data permintaan bantuan...';

  const { data, error } = await supabase

    .from('permintaan_bantuan')

    .select('id, nama, masalah, cerita, status, balasan, created_at')

    .order('created_at', { ascending: false });

  if (error) {

    pesan.textContent = 'Gagal mengambil data: ' + error.message;

    return;

  }

  daftar.innerHTML = '';

  if (!data || data.length === 0) {

    daftar.innerHTML = '<tr><td colspan="5">Belum ada permintaan bantuan.</td></tr>';

    pesan.textContent = 'Belum ada data.';

    return;

  }

  data.forEach(item => {

    const baris = document.createElement('tr');

    function buatSel(teks) {

      const td = document.createElement('td');

      td.textContent = teks || '-';

      return td;

    }

    baris.appendChild(buatSel(item.nama));

    baris.appendChild(buatSel(item.masalah));

    baris.appendChild(buatSel(item.cerita));

    const selStatus = document.createElement('td');

    const pilihStatus = document.createElement('select');

    ['Menunggu', 'Diproses', 'Selesai'].forEach(status => {

      const opsi = document.createElement('option');

      opsi.value = status;

      opsi.textContent = status;

      pilihStatus.appendChild(opsi);

    });

    pilihStatus.value = item.status || 'Menunggu';

    selStatus.appendChild(pilihStatus);

    baris.appendChild(selStatus);

    const selBalasan = document.createElement('td');

    const kotakBalasan = document.createElement('textarea');

    kotakBalasan.placeholder = 'Tuliskan tanggapan untuk siswa...';

    kotakBalasan.value = item.balasan || '';

    const tombolSimpan = document.createElement('button');

    tombolSimpan.textContent = 'Simpan Balasan';

    const info = document.createElement('p');

    info.className = 'keterangan';

    tombolSimpan.addEventListener('click', async () => {

      tombolSimpan.disabled = true;

      tombolSimpan.textContent = 'Menyimpan...';

      info.textContent = '';

      const { error: updateError } = await supabase

        .from('permintaan_bantuan')

        .update({

          status: pilihStatus.value,

          balasan: kotakBalasan.value.trim(),

          responded_at: new Date().toISOString()

        })

        .eq('id', item.id);

      tombolSimpan.disabled = false;

      tombolSimpan.textContent = 'Simpan Balasan';

      if (updateError) {

        info.textContent = 'Gagal menyimpan: ' + updateError.message;

        return;

      }

      info.textContent = 'Balasan dan status berhasil disimpan.';

      pesan.textContent = 'Data berhasil diperbarui.';

    });

    selBalasan.appendChild(kotakBalasan);

    selBalasan.appendChild(tombolSimpan);

    selBalasan.appendChild(info);

    baris.appendChild(selBalasan);

    daftar.appendChild(baris);

  });

  pesan.textContent = 'Berhasil memuat ' + data.length + ' permintaan bantuan.';

}

document.getElementById('muat').addEventListener('click', muatData);

document.getElementById('keluar').addEventListener('click', async () => {

  await supabase.auth.signOut();

  window.location.href = 'auth.html';

});

muatData();

</script>

</body>

</html>
